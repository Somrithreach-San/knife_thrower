<!DOCTYPE html>
<html>
<head>
  <base href="/knife_thrower/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Knife Thrower - A 2-player knife throwing game">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Knife Thrower">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Knife Thrower</title>
  <link rel="manifest" href="manifest.json">
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A1628;
      overflow: hidden;
    }

    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0D1D36 0%, #0B172A 50%, #091222 100%);
      z-index: 99999;
      transition: opacity 0.3s ease-out;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(44, 223, 162, 0.15);
      border-top-color: #2CDFA2;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .loading-text {
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.7);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    // IDM Blocker - Disable IDM's global hooks without breaking browser caching.
    (function() {
      window.installPlugin = function() {};
      window.JetCarService = undefined;
      window.JetIEHook = undefined;
      window.IDM = undefined;
      window.JetGet = undefined;
      
      Object.defineProperty(window, 'external', {
        value: { 
          AddMediaLinks: function() {}, 
          AddMediaLink: function() {}, 
          AddLinks: function() {},
          AddLink: function() {},
        },
        writable: false,
        configurable: false
      });

      const originalFetch = window.fetch;
      window.fetch = function(...args) {
        const [url, options = {}] = args;
        options.headers = options.headers || {};
        options.headers['X-Requested-With'] = 'XMLHttpRequest';
        return originalFetch.apply(this, args);
      };

      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(...args) {
        return originalOpen.apply(this, args);
      };
      
      const originalSend = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.send = function(...args) {
        try { this.setRequestHeader('X-Requested-With', 'XMLHttpRequest'); } catch(e) {}
        return originalSend.apply(this, args);
      };

      // Remove loading indicator once Flutter renders the first frame
      window.addEventListener('flutter-first-frame', function () {
        const loader = document.getElementById('loading-indicator');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function() { loader.remove(); }, 300);
        }
      });
    })();
  </script>
</head>
<body>
  <!-- Initial Web Page Loading Spinner -->
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div class="loading-text">Loading Game...</div>
  </div>

  <script src="flutter_bootstrap.js" async=""></script>
</body>
</html>
