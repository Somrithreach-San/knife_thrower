<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Knife Thrower - A 2-player knife throwing game">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Knife Thrower">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Knife Thrower</title>
  <link rel="manifest" href="manifest.json">
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">

  <style>
    html, body, canvas, flutter-view {
      position: fixed;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #182842;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #1A3050 0%, #162844 50%, #122038 100%);
      z-index: 99999;
      transition: opacity 0.25s ease-out;
    }

    .spinner-wrap {
      width: 40px;
      height: 40px;
      animation: squiggle-spin 1.4s linear infinite;
    }

    @keyframes squiggle-spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spinner-wrap svg circle.track {
      stroke: rgba(44, 223, 162, 0.14);
      stroke-dasharray: none;
    }

    .spinner-wrap svg circle.arc {
      stroke: #2CDFA2;
      stroke-dasharray: 60 100;
      stroke-dashoffset: 0;
      animation: squiggle-arc 1.4s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }

    @keyframes squiggle-arc {
      0%   { stroke-dasharray: 10 100; stroke-dashoffset: 0; }
      40%  { stroke-dasharray: 70 100; stroke-dashoffset: -30; }
      80%  { stroke-dasharray: 70 100; stroke-dashoffset: -90; }
      100% { stroke-dasharray: 10 100; stroke-dashoffset: -120; }
    }
  </style>

  <script>
    // IDM Blocker - Disable IDM's global hooks without breaking browser caching.
    (function() {
      window.installPlugin = function() {};
      window.JetCarService = undefined;
      window.JetIEHook = undefined;
      window.IDM = undefined;
      window.JetGet = undefined;
      
      Object.defineProperty(window, 'external', {
        value: { 
          AddMediaLinks: function() {}, 
          AddMediaLink: function() {}, 
          AddLinks: function() {},
          AddLink: function() {},
        },
        writable: false,
        configurable: false
      });

      const originalFetch = window.fetch;
      window.fetch = function(...args) {
        const [url, options = {}] = args;
        options.headers = options.headers || {};
        options.headers['X-Requested-With'] = 'XMLHttpRequest';
        return originalFetch.apply(this, args);
      };

      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(...args) {
        return originalOpen.apply(this, args);
      };
      
      const originalSend = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.send = function(...args) {
        try { this.setRequestHeader('X-Requested-With', 'XMLHttpRequest'); } catch(e) {}
        return originalSend.apply(this, args);
      };

      // Remove loading indicator once Flutter renders the first frame
      window.addEventListener('flutter-first-frame', function () {
        const loader = document.getElementById('loading-indicator');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function() { loader.remove(); }, 250);
        }
      });
    })();
  </script>
</head>
<body>
  <!-- Loading Spinner — Google Play squiggle style -->
  <div id="loading-indicator">
    <div class="spinner-wrap">
      <svg viewBox="0 0 40 40" width="40" height="40" xmlns="http://www.w3.org/2000/svg">
        <!-- No background track ring — matches Flutter squiggle style -->
        <circle class="arc"
          cx="20" cy="20" r="16"
          fill="none"
          stroke="#2CDFA2"
          stroke-width="3.5"
          stroke-linecap="round" />
      </svg>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async=""></script>
</body>
</html>
