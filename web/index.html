<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Knife Thrower - A 2-player knife throwing game">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Knife Thrower">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Knife Thrower</title>
  <link rel="manifest" href="manifest.json">
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">

  <style>
    html, body, canvas, flutter-view {
      position: fixed;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #182842;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #1A3050 0%, #162844 50%, #122038 100%);
      z-index: 99999;
      transition: opacity 0.25s ease-out;
    }

    #loading-canvas {
      width: 40px;
      height: 40px;
    }
  </style>

  <script>
    // IDM Blocker - Disable IDM's global hooks without breaking browser caching.
    (function() {
      window.installPlugin = function() {};
      window.JetCarService = undefined;
      window.JetIEHook = undefined;
      window.IDM = undefined;
      window.JetGet = undefined;
      
      Object.defineProperty(window, 'external', {
        value: { 
          AddMediaLinks: function() {}, 
          AddMediaLink: function() {}, 
          AddLinks: function() {},
          AddLink: function() {},
        },
        writable: false,
        configurable: false
      });

      const originalFetch = window.fetch;
      window.fetch = function(...args) {
        const [url, options = {}] = args;
        options.headers = options.headers || {};
        options.headers['X-Requested-With'] = 'XMLHttpRequest';
        return originalFetch.apply(this, args);
      };

      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(...args) {
        return originalOpen.apply(this, args);
      };
      
      const originalSend = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.send = function(...args) {
        try { this.setRequestHeader('X-Requested-With', 'XMLHttpRequest'); } catch(e) {}
        return originalSend.apply(this, args);
      };

      // Prevent the browser's automatic PWA install banner/popup
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
      });

      // Remove loading indicator once Flutter renders the first frame
      window.addEventListener('flutter-first-frame', function () {
        const loader = document.getElementById('loading-indicator');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function() { loader.remove(); }, 250);
        }
      });
    })();
  </script>
</head>
<body>
  <!-- Loading Spinner — Google Play squiggle style (matches Flutter AppLoadingIndicator) -->
  <div id="loading-indicator">
    <canvas id="loading-canvas" width="80" height="80"></canvas>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('loading-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const duration = 2200;
      let startTime = null;
      let rafId = null;

      function drawSquiggle(timestamp) {
        const loader = document.getElementById('loading-indicator');
        if (!loader) return;
        if (!startTime) startTime = timestamp;
        const progress = ((timestamp - startTime) % duration) / duration;

        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const strokeWidth = w * 0.09;
        const baseRadius = (w - strokeWidth) / 2 - strokeWidth * 0.5;
        const wavesCount = 8;
        const waveAmplitude = strokeWidth * 0.55;
        const baseRotation = progress * 2 * Math.PI * 2.0;
        const arcLength = (0.35 + 0.50 * (0.5 + 0.5 * Math.sin(progress * 4 * Math.PI))) * Math.PI;

        ctx.clearRect(0, 0, w, h);

        // Partial track arc with gap where squiggle is
        const gapAngle = (strokeWidth * 1.4) / baseRadius;
        const trackSweep = 2 * Math.PI - arcLength - 2 * gapAngle;
        if (trackSweep > 0.05) {
          ctx.beginPath();
          ctx.arc(cx, cy, baseRadius, baseRotation + arcLength + gapAngle, baseRotation + arcLength + gapAngle + trackSweep);
          ctx.strokeStyle = 'rgba(44, 223, 162, 0.15)';
          ctx.lineWidth = strokeWidth * 0.7;
          ctx.lineCap = 'round';
          ctx.stroke();
        }

        // Squiggle wave arc
        ctx.beginPath();
        const steps = 90;
        const wavePhase = progress * 2 * Math.PI * 4.0;
        for (let i = 0; i <= steps; i++) {
          const fraction = i / steps;
          const theta = baseRotation + fraction * arcLength;
          const radiusOffset = Math.sin(theta * wavesCount - wavePhase) * waveAmplitude;
          const r = baseRadius + radiusOffset;
          const x = cx + r * Math.cos(theta);
          const y = cy + r * Math.sin(theta);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = '#2CDFA2';
        ctx.lineWidth = strokeWidth;
        ctx.lineCap = 'round';
        ctx.stroke();

        rafId = requestAnimationFrame(drawSquiggle);
      }

      rafId = requestAnimationFrame(drawSquiggle);
      window.addEventListener('flutter-first-frame', function() {
        if (rafId) cancelAnimationFrame(rafId);
      });
    })();
  </script>

  <script src="flutter_bootstrap.js" async=""></script>
</body>
</html>
